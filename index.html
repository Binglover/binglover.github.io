<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Calculator S!x</title>
  <meta name="description" content="" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ccircle cx='64' cy='64' r='62' fill='%23c33764'/%3E%3Cpath d='M32 48h64L80 96H48z' fill='%23fff' opacity='.9'/%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="site">
   <header role="banner">
  <h1 id="title" class="title" aria-live="polite">Calculator S!x</h1>
  <p class="subtle">For all your calculator needs!</p>
  <p id="rarity" class="rarity" role="status" aria-live="assertive"></p>

<!-- ✅ CALCULATOR PANEL (MAIN PAGE ONLY) -->
<div id="calculator" class="calculator">
  <input id="calc-display" type="text"/>

 <div class="calc-buttons">
  <button>7</button><button>8</button><button>9</button><button>C</button>
  <button>4</button><button>5</button><button>6</button><button>/</button>
  <button>1</button><button>2</button><button>3</button><button>*</button>
  <button>0</button><button>-</button><button>+</button><button>=</button>
</div>

  <!-- Floating Password Button -->
<button id="password-btn" aria-label="Open password panel" style="display:none;">🔒</button>

<div id="password-panel">
  <div class="panel-content">
    <button id="close-panel" aria-label="Close panel">✖</button>
    <h3>Enter Password</h3>
    <input type="password" id="password-input" placeholder="Enter password"/>
    <button id="password-submit">Submit</button>
    <p id="password-message"></p>
</div>
</body>
</html>
